<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- Drawn by `labbrain graph` or `labbrain search`: the wiki's graph, explored in the browser.
     One file, nothing loaded from elsewhere; the data is in the script tag at the end. -->
<style>
.viz-root {
  color-scheme: light;
  --surface: #fcfcfb; --plane: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11, 11, 11, 0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --other: #898781;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface: #1a1a19; --plane: #0d0d0d; --ink: #f0efec; --ink-2: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255, 255, 255, 0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root {
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 340px; height: 100vh;
  background: var(--plane); color: var(--ink);
}
header {
  grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--ring); background: var(--surface);
}
header form { display: flex; gap: 4px; }
header input[type=search] { width: 220px; }
#stage { position: relative; overflow: hidden; background: var(--surface); }
#svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#svg.panning { cursor: grabbing; }
.edge { fill: none; }
.edge.link { stroke: var(--axis); stroke-width: 1; }
.edge.child { stroke: var(--ink-2); stroke-width: 1.5; }
.edge.covers { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.edge.start { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
.edge.proposed { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 8 4; }
.edge.lit { stroke: var(--ink); stroke-width: 2; }
.node { cursor: pointer; }
.node .dot { stroke: var(--surface); stroke-width: 2; }
.node .hit-area { fill: transparent; }
.node .halo { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.node text {
  fill: var(--ink); font-size: 12px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px;
  stroke-linejoin: round; pointer-events: none;
}
.node.center text { font-weight: 600; font-size: 13px; }
.node:hover .dot, .node:focus .dot { stroke: var(--ink); }
.node:focus { outline: none; }
#tip {
  position: absolute; display: none; pointer-events: none; max-width: 320px; padding: 8px 10px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
#tip strong { display: block; }
.meta { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
#notice { position: absolute; left: 12px; bottom: 10px; color: var(--ink-2); font-size: 12px; }
aside { overflow: auto; padding: 12px 14px; border-left: 1px solid var(--ring); background: var(--surface); }
aside h2 { font-size: 16px; margin: 0 0 4px; overflow-wrap: anywhere; }
aside h3 {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--ink-2); margin: 18px 0 6px;
}
aside ul { list-style: none; padding: 0; margin: 0; }
aside li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
aside li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
aside p { margin: 6px 0; }
button.as-link {
  background: none; border: 0; padding: 0; color: var(--ink); text-align: left; cursor: pointer;
  font: inherit;
}
button.as-link:hover, button.as-link:focus-visible { text-decoration: underline; }
.key { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; }
a { color: var(--ink); }
label { white-space: nowrap; }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <button type="button" id="home">Wiki root</button>
    <form id="find">
      <input id="q" type="search" placeholder="Title, topic, tag, path…" aria-label="Search">
      <button>Search</button>
    </form>
    <label>Depth
      <select id="depth"><option>0</option><option>1</option><option>2</option><option>3</option></select>
    </label>
    <span>Edges:
      <label><input type="checkbox" id="kind-link" checked> links</label>
      <label><input type="checkbox" id="kind-child" checked> summary tree</label>
      <label><input type="checkbox" id="kind-covers"> a summary's notes</label>
      <label><input type="checkbox" id="kind-proposed" checked> proposed (dashed)</label>
    </span>
    <label><input type="checkbox" id="context" checked> summaries over notes</label>
    <label>Path has <input id="path" type="text" size="14"></label>
  </header>
  <div id="stage">
    <svg id="svg" role="img" aria-label="The wiki's graph">
      <g id="world"><g id="edges"></g><g id="nodes"></g></g>
    </svg>
    <div id="tip" role="status"></div>
    <div id="notice"></div>
  </div>
  <aside id="side" aria-label="What is in view"></aside>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const G = D.graph;
const ROOT = ":root", QUERY = ":query";  // never a file: every node is a .md path
const MAX = 350;  // more nodes than this and the view is cut, ring by ring
const SVG = "http://www.w3.org/2000/svg";
const CONCEPTS = new Set(["Paper", "Method", "Algorithm", "Finding", "Dataset", "Software", "Reference"]);
const GROUPS = {s1: "Summaries", s2: "Notes", s3: "Paper concepts", other: "Other types"};

const byId = new Map(G.nodes.map(n => [n.id, n]));
const adj = {link: new Map(), child: new Map(), covers: new Map(), proposed: new Map()};
const put = (m, a, b) => (m.get(a) || m.set(a, new Set()).get(a)).add(b);
for (const e of G.edges) { put(adj[e.kind], e.from, e.to); put(adj[e.kind], e.to, e.from); }
const cover = new Map(G.edges.filter(e => e.kind === "covers").map(e => [e.to, e.from]));
const parented = new Set(G.edges.filter(e => e.kind === "child").map(e => e.to));
const tops = G.nodes.filter(n => n.type === "Folder Summary" && !parented.has(n.id)).map(n => n.id);
const typeOf = n => n.type || "(no type)";
const types = [...new Set(G.nodes.map(typeOf))].sort();
const shownTypes = new Set(types.filter(t => !D.hidden.includes(t)));

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, text) => {
  const e = tag.startsWith("svg:") ? document.createElementNS(SVG, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;  // note text is data, never markup
  return e;
};
const group = n => n.type === "Folder Summary" ? "s1" : n.type === "Note" ? "s2"
  : CONCEPTS.has(n.type) ? "s3" : "other";
const colour = n => `var(--${group(n)})`;
const href = id => D.fileUrl ? D.fileUrl.replace("{path}", encodeURI(id)) : D.base + encodeURI(id);
const short = (s, k = 28) => s.length > k ? s.slice(0, k - 1) + "…" : s;

// Search in the page: the headers only, as step 1 of `labbrain search`.
const plain = s => s.toLowerCase().replace(/[-_]+/g, " ");  // "dna-storage" finds Synthetic_DNA_storage
function meanings(query) {
  const q = plain(query).trim().replace(/\s+/g, " ");
  const names = Object.keys(D.topics).filter(n =>
    [n, ...D.topics[n].synonyms].some(s => plain(s) === q));
  const words = new Set([q]), seen = new Set(), todo = [...names];
  while (todo.length) {
    const n = todo.pop();
    if (seen.has(n)) continue;
    seen.add(n);
    [n, ...D.topics[n].synonyms].forEach(s => words.add(plain(s)));
    todo.push(...D.topics[n].narrower);
  }
  return [[...words], [...seen]];
}
function headerHits(query) {
  const [words, named] = meanings(query);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alt = words.sort((a, b) => b.length - a.length).map(esc).join("|");
  const re = new RegExp(`(?<![\\p{L}\\p{N}_])(?:${alt})`, "u");
  const labels = new Set([...words, ...named.map(plain)]);
  return G.nodes.filter(n =>
    ["title", "description", "id"].some(k => re.test(plain(n[k] || ""))) ||
    [...(n.topics || []), ...(n.tags || [])].some(t => labels.has(plain(t)))
  ).map(n => n.id);
}

// What to show: the centre, then ring after ring of neighbours, through the edges switched on.
const kinds = () => ({link: $("kind-link").checked, child: $("kind-child").checked,
  covers: $("kind-covers").checked, proposed: $("kind-proposed").checked});
const pathHas = () => $("path").value.trim().toLowerCase();
function visible(id) {
  const n = byId.get(id);
  return !!n && shownTypes.has(typeOf(n)) && (!pathHas() || id.toLowerCase().includes(pathHas()));
}
function neighbours(id, on, hits) {
  if (id === ROOT) return tops.filter(visible);
  if (id === QUERY) return hits.filter(visible);
  const out = new Set();
  for (const k of Object.keys(on)) if (on[k]) for (const x of adj[k].get(id) || []) if (visible(x)) out.add(x);
  return [...out].sort();
}
function reach(center, depth, hits) {
  const on = kinds(), dist = new Map([[center, 0]]), parent = new Map(), context = new Set();
  const rings = depth + (center === QUERY ? 1 : 0);  // a search's hits are ring 1, at depth 0
  let ring = [center];
  for (let d = 1; d <= rings && ring.length; d++) {
    const next = [];
    for (const p of ring) for (const q of neighbours(p, on, hits)) {
      if (!dist.has(q)) { dist.set(q, d); parent.set(q, p); next.push(q); }
    }
    ring = next;
  }
  if ($("context").checked) for (const id of [...dist.keys()]) {
    const s = cover.get(id);
    if (s && !dist.has(s) && visible(s)) { dist.set(s, dist.get(id) + 1); parent.set(s, id); context.add(s); }
  }
  let ids = [...dist.keys()].sort((a, b) => dist.get(a) - dist.get(b));
  const cut = ids.length > MAX ? ids.length : 0;
  ids = ids.slice(0, MAX);
  return {ids, dist, parent, context, cut, on};
}

// Where: the centre in the middle, ring d one step further out. Each ring is spaced evenly, in
// the order of its nodes' parents, then turned so that children sit as close to their parents as
// they can.
function place(v) {
  const pos = new Map([[v.ids[0], {x: 0, y: 0, a: 0}]]);
  let radius = 0;
  for (let d = 1; ; d++) {
    const ring = v.ids.filter(id => v.dist.get(id) === d);
    if (!ring.length) break;
    const up = id => pos.get(v.parent.get(id)).a;
    const turn = a => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    ring.sort((a, b) => turn(up(a)) - turn(up(b)) || (a < b ? -1 : 1));
    const step = (2 * Math.PI) / ring.length;
    let sin = 0, cos = 0;
    ring.forEach((id, i) => { sin += Math.sin(up(id) - i * step); cos += Math.cos(up(id) - i * step); });
    const offset = sin || cos ? Math.atan2(sin, cos) : 0;
    radius = Math.max(radius + 240, ring.length * 30 / (2 * Math.PI));  // a label fits between rings
    ring.forEach((id, i) => {
      const a = offset + i * step;
      pos.set(id, {x: radius * Math.sin(a), y: -radius * Math.cos(a), a});
    });
  }
  return pos;
}

const node = id => id === ROOT ? {id, title: G.title, type: "the wiki"}
  : id === QUERY ? {id, title: `“${state.query}”`, type: "search"} : byId.get(id);
let state = {}, view = null, pos = null, zoom = {x: 0, y: 0, k: 1}, hits = [];

function read() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("n") && byId.has(h.get("n"))) return {center: h.get("n")};
  if (h.get("q")) return {center: QUERY, query: h.get("q")};
  if (!location.hash && D.start) return {center: QUERY, query: D.start.query, hits: D.start.hits};
  return {center: ROOT};
}
function go(hash) { location.hash = hash; }

function draw() {
  state = read();
  hits = state.center !== QUERY ? [] : state.hits || headerHits(state.query);
  $("q").value = state.query || "";
  view = reach(state.center, +$("depth").value, hits);
  pos = place(view);
  const shown = new Set(view.ids);
  const edges = $("edges"), nodes = $("nodes");
  edges.replaceChildren(); nodes.replaceChildren();
  const lines = [];
  const line = (a, b, cls) => lines.push({a, b, e: edges.appendChild(el("svg:line", {class: `edge ${cls}`}))});
  for (const e of G.edges) {
    const on = view.on[e.kind] || (e.kind === "covers" && (view.context.has(e.from) || view.context.has(e.to)));
    if (on && shown.has(e.from) && shown.has(e.to)) line(e.from, e.to, e.kind);
  }
  for (const id of view.ids) if (view.dist.get(id) === 1 && (state.center === ROOT || state.center === QUERY)) {
    line(state.center, id, "start");
  }
  const label = view.ids.length <= 80;
  for (const id of view.ids) {
    const n = node(id), virtual = id === ROOT || id === QUERY, d = view.dist.get(id);
    const g = nodes.appendChild(el("svg:g", {class: "node" + (d === 0 ? " center" : ""), tabindex: 0}));
    g.dataset.id = id;
    g.appendChild(el("svg:circle", {class: "hit-area", r: 13}));
    if (hits.includes(id)) g.appendChild(el("svg:circle", {class: "halo", r: 12}));
    const r = virtual ? 11 : n.type === "Folder Summary" ? 9 : 6;
    g.appendChild(el("svg:circle", {class: "dot", r, fill: virtual ? "var(--ink)" : colour(n)}));
    if (label || d <= 1 || n.type === "Folder Summary" || hits.includes(id)) {
      // outward along the node's radius, so that neighbours on a ring never overlap; turned over
      // on the left half, so that no label reads upside down
      const t = g.appendChild(el("svg:text", {x: r + 4, y: 4}, short(n.title)));
      const deg = ((pos.get(id).a * 180 / Math.PI) % 360 + 360) % 360;
      if (d > 0 && deg > 180) {
        t.setAttribute("transform", `rotate(${deg + 90})`);
        t.setAttribute("x", -(r + 4));
        t.setAttribute("text-anchor", "end");
      } else if (d > 0) {
        t.setAttribute("transform", `rotate(${deg - 90})`);
      }
    }
  }
  draw.lines = lines;
  move();
  fit();
  side();
  $("notice").textContent = view.cut ? `Showing ${MAX} of ${view.cut}: lower the depth, or hide some types.` : "";
}
function move() {
  for (const g of $("nodes").children) {
    const p = pos.get(g.dataset.id);
    g.setAttribute("transform", `translate(${p.x},${p.y})`);
  }
  for (const {a, b, e} of draw.lines) {
    const p = pos.get(a), q = pos.get(b);
    e.setAttribute("x1", p.x); e.setAttribute("y1", p.y); e.setAttribute("x2", q.x); e.setAttribute("y2", q.y);
  }
}
function fit() {
  const box = $("svg").getBoundingClientRect(), xs = [...pos.values()];
  const label = 200;  // room for the labels on the outer ring
  const w = Math.max(...xs.map(p => p.x)) - Math.min(...xs.map(p => p.x)) + 2 * label;
  const h = Math.max(...xs.map(p => p.y)) - Math.min(...xs.map(p => p.y)) + 2 * label;
  zoom.k = Math.min(1.2, box.width / w, box.height / h);
  zoom.x = box.width / 2 - zoom.k * (Math.min(...xs.map(p => p.x)) + Math.max(...xs.map(p => p.x))) / 2;
  zoom.y = box.height / 2 - zoom.k * (Math.min(...xs.map(p => p.y)) + Math.max(...xs.map(p => p.y))) / 2;
  $("world").setAttribute("transform", `translate(${zoom.x},${zoom.y}) scale(${zoom.k})`);
}

function side() {
  const s = $("side"), n = node(state.center);
  s.replaceChildren(el("h2", {}, n.title));
  s.appendChild(el("p", {class: "meta"}, state.center === ROOT || state.center === QUERY ? n.type : `${n.type || "no type"} · ${n.id}`));
  if (n.description) s.appendChild(el("p", {}, n.description));
  const labels = [...(n.topics || []), ...(n.tags || [])];
  if (labels.length) s.appendChild(el("p", {class: "meta"}, labels.join(" · ")));
  if (byId.has(state.center)) {
    const p = s.appendChild(el("p"));
    p.appendChild(el("a", {href: href(state.center), target: "_blank", rel: "noopener"}, "Open the file"));
  }
  // Links code proposes: files that share topics with this one, and no link joins them yet.
  const offered = [...(adj.proposed.get(state.center) || [])].sort();
  if (offered.length) {
    s.appendChild(el("h3", {}, `Proposed links (${offered.length})`));
    s.appendChild(el("p", {class: "meta"}, "They share these topics, and no link joins them yet. " +
      "To accept one, add the link to a file; to turn it down, run labbrain reject."));
    const ul = s.appendChild(el("ul")), mine = new Set(n.topics || []);
    for (const id of offered) {
      const m = node(id), li = ul.appendChild(el("li"));
      li.appendChild(el("span", {class: "key", style: `background:${colour(m)}`}));
      const b = li.appendChild(el("button", {type: "button", class: "as-link grow", title: id}, m.title));
      b.addEventListener("click", () => go("n=" + encodeURIComponent(id)));
      li.appendChild(el("span", {class: "meta"}, (m.topics || []).filter(t => mine.has(t)).join(", ")));
    }
  }
  if (state.center === QUERY) {
    s.appendChild(el("p", {class: "meta"}, state.hits ? "Found by labbrain search." :
      "Found by title, description, path, tags and topics. For the full text, run labbrain search --text."));
  }
  const max = Math.max(...view.ids.map(id => view.dist.get(id)));
  const search = state.center === QUERY;
  const sections = [];
  for (let d = 1; d <= max; d++) {
    const heading = search ? (d === 1 ? "Found" : `${d - 1} away from what was found`) : `${d} away`;
    sections.push([heading, view.ids.filter(id => view.dist.get(id) === d && !view.context.has(id))]);
  }
  sections.push(["Summaries over notes in view", [...view.context]]);
  for (const [heading, ids] of sections) {
    if (!ids.length) continue;
    ids.sort((a, b) => node(a).title.localeCompare(node(b).title));
    s.appendChild(el("h3", {}, `${heading} (${ids.length})`));
    const ul = s.appendChild(el("ul"));
    for (const id of ids) {
      const m = node(id), li = ul.appendChild(el("li"));
      li.appendChild(el("span", {class: "key", style: `background:${colour(m)}`}));
      const b = li.appendChild(el("button", {type: "button", class: "as-link grow", title: id}, m.title));
      b.addEventListener("click", () => go("n=" + encodeURIComponent(id)));
      li.appendChild(el("a", {href: href(id), target: "_blank", rel: "noopener", class: "meta", "aria-label": "open " + m.title}, "open"));
    }
  }
  s.appendChild(el("h3", {}, "Types"));
  const ul = s.appendChild(el("ul"));
  const count = t => G.nodes.filter(m => typeOf(m) === t).length;
  for (const t of types) {
    const li = ul.appendChild(el("li")), lab = li.appendChild(el("label", {class: "grow"}));
    const box = lab.appendChild(el("input", {type: "checkbox"}));
    box.checked = shownTypes.has(t);
    box.addEventListener("change", () => { box.checked ? shownTypes.add(t) : shownTypes.delete(t); draw(); });
    lab.appendChild(el("span", {class: "key", style: `background:${colour({type: t === "(no type)" ? null : t})}`}));
    lab.appendChild(document.createTextNode(` ${t} (${count(t)})`));
  }
  s.appendChild(el("p", {class: "meta"}, Object.entries(GROUPS).map(([k, v]) => v).join(", ") +
    ": blue, orange, aqua and grey. Summaries are drawn larger."));
}

// Hover, focus, click, drag and zoom.
const tip = $("tip");
function showTip(g, x, y) {
  const n = node(g.dataset.id);
  tip.replaceChildren(el("strong", {}, n.title),
    el("span", {class: "meta"}, n.id === ROOT || n.id === QUERY ? n.type : `${n.type || "no type"} · ${n.id}`));
  if (n.description) tip.appendChild(el("div", {class: "meta"}, n.description));
  tip.style.display = "block";
  const box = $("stage").getBoundingClientRect();
  tip.style.left = Math.min(x - box.left + 14, box.width - 330) + "px";
  tip.style.top = (y - box.top + 14) + "px";
  for (const l of draw.lines) l.e.classList.toggle("lit", l.a === g.dataset.id || l.b === g.dataset.id);
}
function hideTip() { tip.style.display = "none"; for (const l of draw.lines) l.e.classList.remove("lit"); }
const nodes = $("nodes");
nodes.addEventListener("pointerover", e => { const g = e.target.closest(".node"); if (g) showTip(g, e.clientX, e.clientY); });
nodes.addEventListener("pointerout", e => { if (e.target.closest(".node")) hideTip(); });
nodes.addEventListener("focusin", e => {
  const g = e.target.closest(".node"), r = g.getBoundingClientRect();
  showTip(g, r.right, r.bottom);
});
nodes.addEventListener("focusout", hideTip);
nodes.addEventListener("keydown", e => {
  const g = e.target.closest(".node");
  if (g && e.key === "Enter") choose(g.dataset.id);
});
function choose(id) {
  if (id === ROOT) go("root");
  else if (id !== QUERY) go("n=" + encodeURIComponent(id));
}
let drag = null;
$("svg").addEventListener("pointerdown", e => {
  const g = e.target.closest(".node");
  drag = {g, x: e.clientX, y: e.clientY, moved: false, zx: zoom.x, zy: zoom.y};
  $("svg").setPointerCapture(e.pointerId);
  if (!g) $("svg").classList.add("panning");
});
$("svg").addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (!drag.moved) return;
  hideTip();
  if (drag.g) {
    const p = pos.get(drag.g.dataset.id);
    p.x += dx / zoom.k; p.y += dy / zoom.k; drag.x = e.clientX; drag.y = e.clientY;
    move();
  } else {
    zoom.x = drag.zx + dx; zoom.y = drag.zy + dy;
    $("world").setAttribute("transform", `translate(${zoom.x},${zoom.y}) scale(${zoom.k})`);
  }
});
$("svg").addEventListener("pointerup", () => {
  if (drag && drag.g && !drag.moved) choose(drag.g.dataset.id);
  drag = null;
  $("svg").classList.remove("panning");
});
$("svg").addEventListener("wheel", e => {
  e.preventDefault();
  const box = $("svg").getBoundingClientRect(), f = Math.exp(-e.deltaY * 0.0015);
  const mx = e.clientX - box.left, my = e.clientY - box.top;
  zoom.x = mx - (mx - zoom.x) * f; zoom.y = my - (my - zoom.y) * f; zoom.k *= f;
  $("world").setAttribute("transform", `translate(${zoom.x},${zoom.y}) scale(${zoom.k})`);
}, {passive: false});

$("home").addEventListener("click", () => go("root"));
$("find").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) go("q=" + encodeURIComponent(q));
});
for (const id of ["depth", "kind-link", "kind-child", "kind-covers", "kind-proposed", "context"]) $(id).addEventListener("change", draw);
$("path").addEventListener("input", draw);
window.addEventListener("hashchange", draw);
window.addEventListener("resize", fit);
$("depth").value = String(D.start ? Math.min(3, D.start.depth) : 2);
draw();
</script>
</body>
</html>
